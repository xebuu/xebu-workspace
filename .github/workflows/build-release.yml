name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            artifact_name: XebuWorkspace-windows
            artifact_path: dist/XebuWorkspace.exe
            release_file: dist/XebuWorkspace.exe

          - os: macos-latest
            artifact_name: XebuWorkspace-macos
            artifact_path: dist/XebuWorkspace.dmg
            release_file: dist/XebuWorkspace.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean XebuWorkspace.spec

      - name: Create DMG
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname XebuWorkspace \
            -srcfolder dist/XebuWorkspace.app \
            -ov -format UDZO dist/XebuWorkspace.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: XebuWorkspace-windows
          path: windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: XebuWorkspace-macos
          path: macos

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/dist/XebuWorkspace.exe
            macos/dist/XebuWorkspace.dmg
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
